; PHP-FPM pool configuration for production
[www]
user = nginx
group = nginx

; Listen on TCP socket (matches nginx fastcgi_pass 127.0.0.1:9000)
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500

; Catch worker output
catch_workers_output = yes
decorate_workers_output = no

; Clear environment (use .env file or docker env vars instead)
clear_env = no
