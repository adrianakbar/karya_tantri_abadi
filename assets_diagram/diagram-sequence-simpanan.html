<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sequence Diagram - Catat Simpanan</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Times New Roman',serif;background:#f1f5f9;display:flex;justify-content:center;padding:30px}
  .container{background:#fff;padding:36px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.12);width:860px}
  h2{text-align:center;font-size:18px;color:#1e293b;margin-bottom:20px}
  svg{display:block;margin:0 auto;font-family:'Times New Roman',serif}
  .actor{fill:#2563eb}
  .actor.usr{fill:#059669}
  .actor.db{fill:#dc2626}
  .actor-txt{fill:#fff;font-size:12px;font-weight:bold}
  .lifeline{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4}
  .actbar{fill:#e2e8f0;stroke:#64748b;stroke-width:1}
  .msg{stroke:#334155;stroke-width:1.5}
  .msg.ret{stroke-dasharray:5 4;stroke:#64748b}
  .mlbl{fill:#1e293b;font-size:11px}
  .mlbl.ret{fill:#64748b;font-style:italic}
  .frame{fill:none;stroke:#7c3aed;stroke-width:1.2}
  .frame-tab{fill:#7c3aed}
  .frame-tab-txt{fill:#fff;font-size:10px;font-weight:bold}
  .guard{fill:#6d28d9;font-size:10px;font-style:italic}
  .divider{stroke:#7c3aed;stroke-width:1;stroke-dasharray:4 3}
</style>
</head>
<body>
<div class="container">
  <h2>Gambar 4.x Sequence Diagram Proses Catat Simpanan</h2>
  <svg viewBox="0 0 820 620" width="820" height="620">
    <!-- lifelines -->
    <line class="lifeline" x1="110" y1="54" x2="110" y2="590"/>
    <line class="lifeline" x1="310" y1="54" x2="310" y2="590"/>
    <line class="lifeline" x1="520" y1="54" x2="520" y2="590"/>
    <line class="lifeline" x1="720" y1="54" x2="720" y2="590"/>

    <!-- actor heads -->
    <rect class="actor usr" x="50" y="20" width="120" height="30" rx="6"/>
    <text class="actor-txt" x="110" y="40" text-anchor="middle">Anggota</text>
    <rect class="actor" x="250" y="20" width="120" height="30" rx="6"/>
    <text class="actor-txt" x="310" y="40" text-anchor="middle">Admin</text>
    <rect class="actor" x="460" y="20" width="120" height="30" rx="6"/>
    <text class="actor-txt" x="520" y="40" text-anchor="middle">Sistem</text>
    <rect class="actor db" x="660" y="20" width="120" height="30" rx="6"/>
    <text class="actor-txt" x="720" y="40" text-anchor="middle">MySQL</text>

    <!-- activation bars -->
    <rect class="actbar" x="305" y="86" width="10" height="470"/>
    <rect class="actbar" x="515" y="118" width="10" height="410"/>

    <!-- m1: Anggota serah setoran ke Admin (offline) -->
    <text class="mlbl" x="210" y="78" text-anchor="middle">1: serah setoran cicilan (offline)</text>
    <line class="msg" x1="110" y1="86" x2="305" y2="86" marker-end="url(#ah)"/>

    <!-- m2: Admin buka form / pilih jenis -->
    <text class="mlbl" x="418" y="110" text-anchor="middle">2: input simpanan (jenis: Pokok/Wajib/Sukarela, nominal)</text>
    <line class="msg" x1="315" y1="118" x2="515" y2="118" marker-end="url(#ah)"/>

    <!-- m3: Sistem validasi (self) -->
    <text class="mlbl" x="540" y="146" text-anchor="start">3: validasi nominal &amp; jenis</text>
    <path class="msg" d="M525 138 h40 v18 h-40" fill="none" marker-end="url(#ah)"/>

    <!-- ALT frame -->
    <rect class="frame" x="270" y="180" width="480" height="330" rx="4"/>
    <rect class="frame-tab" x="270" y="180" width="46" height="18" rx="3"/>
    <text class="frame-tab-txt" x="293" y="193" text-anchor="middle">ALT</text>

    <!-- region 1: valid -->
    <text class="guard" x="322" y="194">[nominal valid, &gt; 0]</text>

    <!-- m4: Sistem simpan ke MySQL -->
    <text class="mlbl" x="622" y="222" text-anchor="middle">4: INSERT transaksi simpanan</text>
    <line class="msg" x1="525" y1="230" x2="715" y2="230" marker-end="url(#ah)"/>

    <!-- m5: MySQL return -->
    <text class="mlbl ret" x="622" y="256" text-anchor="middle">5: baris tersimpan</text>
    <line class="msg ret" x1="715" y1="264" x2="525" y2="264" marker-end="url(#ah)"/>

    <!-- m6: jika Catat dari Cicilan, tautkan -->
    <text class="mlbl" x="540" y="292" text-anchor="start">6: tautkan ke pembayaran (Catat dari Cicilan)</text>
    <path class="msg" d="M525 284 h40 v18 h-40" fill="none" marker-end="url(#ah)"/>

    <!-- m7: Sistem -> Admin sukses -->
    <text class="mlbl ret" x="418" y="326" text-anchor="middle">7: notifikasi tersimpan &amp; saldo diperbarui</text>
    <line class="msg ret" x1="515" y1="334" x2="315" y2="334" marker-end="url(#ah)"/>

    <!-- m8: Admin -> Anggota (anggota memantau) -->
    <text class="mlbl ret" x="120" y="360" text-anchor="start">8: saldo simpanan tampil (anggota memantau)</text>
    <line class="msg ret" x1="305" y1="368" x2="110" y2="368" marker-end="url(#ah)"/>

    <!-- divider -->
    <line class="divider" x1="278" y1="392" x2="742" y2="392"/>

    <!-- region 2: invalid -->
    <text class="guard" x="322" y="410">[else — nominal 0 / negatif]</text>

    <!-- m9: Sistem -> Admin error -->
    <text class="mlbl ret" x="418" y="444" text-anchor="middle">9: pesan error validasi</text>
    <line class="msg ret" x1="515" y1="452" x2="315" y2="452" marker-end="url(#ah)"/>

    <!-- m10: Admin perbaiki input (self) -->
    <text class="mlbl" x="335" y="480" text-anchor="start">10: perbaiki nominal &amp; submit ulang</text>
    <path class="msg" d="M315 472 h40 v18 h-40" fill="none" marker-end="url(#ah)"/>

    <!-- markers -->
    <defs>
      <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
        <polygon points="0 0, 9 3.5, 0 7" fill="#334155"/>
      </marker>
    </defs>
  </svg>
</div>
</body>
</html>
